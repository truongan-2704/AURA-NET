# AURA-Net Mobile Configuration
# Target: 8-12G FLOPs, 1.5-2M params for mobile devices

model:
  name: aura_net_mobile
  img_size: 512  # Balanced input size
  num_classes: 10
  width_mult: 0.375
  top_k: 8
  use_topk_inspector: false
  
  # Mobile-optimized channels
  channels:
    stem: 24
    local: 48
    global: 64
    decoder: 64
  
  # Architecture optimizations
  optimizations:
    convnext_blocks: 1  # Reduce blocks
    gsm_blocks: 1
    freq_layers: 1
    expansion_ratio: 3  # Moderate expansion
    use_depthwise: true
    skip_detail_inspector: false
    lightweight_router: true

train:
  epochs: 120
  batch_size: 24
  lr: 0.001
  weight_decay: 0.0005
  optimizer: adamw
  scheduler: cosine
  amp: true
  device: auto
  seed: 42
  save_dir: runs/train
  resume: null

loss:
  lambda_cls: 1.0
  lambda_box: 5.0
  lambda_iou: 2.0
  lambda_obj: 1.0
  lambda_region: 0.8
  lambda_evidence: 0.4
  lambda_uncertainty: 0.08
  lambda_route: 0.03

val:
  batch_size: 48
  conf_thres: 0.25
  iou_thres: 0.45
  max_det: 300

infer:
  conf_thres: 0.25
  iou_thres: 0.45
  max_det: 300
  save_dir: runs/infer
  visualize_evidence: true

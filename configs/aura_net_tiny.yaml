model:
  name: aura_net_tiny
  img_size: 640
  num_classes: 10
  width_mult: 0.5
  top_k: 8
  use_topk_inspector: false
  channels:
    stem: 32
    local: 80
    global: 96
    decoder: 96

train:
  epochs: 100
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0005
  optimizer: adamw
  scheduler: cosine
  amp: true
  device: auto
  seed: 42
  save_dir: runs/train
  resume: null

loss:
  lambda_cls: 1.0
  lambda_box: 5.0
  lambda_iou: 2.0
  lambda_obj: 1.0
  lambda_region: 1.0
  lambda_evidence: 0.5
  lambda_uncertainty: 0.1
  lambda_route: 0.05

val:
  batch_size: 32
  conf_thres: 0.25
  iou_thres: 0.45
  max_det: 300

infer:
  conf_thres: 0.25
  iou_thres: 0.45
  max_det: 300
  save_dir: runs/infer
  visualize_evidence: true
